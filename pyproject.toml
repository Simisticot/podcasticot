[project]
name = "podcasticot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.1",
    "fastapi[standard]>=0.141.1",
    "feedparser==6.0.11",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.11.0",
    "pydantic>=2.13.5",
    "sentry-sdk>=2.39.0",
]

[tool.pytest.ini_options]
addopts = "--basetemp=/dev/shm/pytest-podcasticot"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
[dependency-groups]
dev = [
    "pytest==8.2.0",
    "ruff>=0.13.2",
    "pyrefly>=0.46.0",
    "freezegun>=1.5.5",
]
